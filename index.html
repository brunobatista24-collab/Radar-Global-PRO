      { t: "WYNN", apiSym: "WYNN", n: "Wynn Resorts", s: "Consumo", tipo: "DIVIDENDOS", m: "$", p: 88.40, eps: 4.91, g: 7, peAlvo: 21.4, pot: "BOM POTENCIAL", nota: "Resorts e entretenimento." },
      { t: "RH", apiSym: "RH", n: "Restoration Hardware", s: "Consumo", tipo: "ACUMULATIVO", m: "$", p: 315.00, eps: 12.12, g: 8, peAlvo: 26.8, pot: "MUITO POTENCIAL", nota: "Mobiliário e design." },
      { t: "LCID", apiSym: "LCID", n: "Lucid Group", s: "Consumo", tipo: "ACUMULATIVO", m: "$", p: 2.25, eps: -1.10, g: 0, peAlvo: 10.0, pot: "POUCO", nota: "Veículos elétricos em fase de escala." },

      { t: "META", apiSym: "META", n: "Meta Platforms", s: "Comunicações", tipo: "ACUMULATIVO", m: "$", p: 580.00, eps: 21.89, g: 11, peAlvo: 27.9, pot: "MUITO POTENCIAL", nota: "Redes sociais e publicidade digital." },
      { t: "GRAB", apiSym: "GRAB", n: "Grab Holdings", s: "Comunicações", tipo: "ACUMULATIVO", m: "$", p: 4.15, eps: 0.08, g: 12, peAlvo: 61.3, pot: "MUITO POTENCIAL", nota: "Mobilidade e entregas no Sudeste Asiático." },
      { t: "VRT", apiSym: "VRT", n: "Vertiv Holdings", s: "Indústria", tipo: "ACUMULATIVO", m: "$", p: 112.50, eps: 3.52, g: 13, peAlvo: 33.5, pot: "MUITO POTENCIAL", nota: "Energia e refrigeração para data centers." },
      { t: "ETN", apiSym: "ETN", n: "Eaton Corp.", s: "Indústria", tipo: "DIVIDENDOS", m: "$", p: 332.10, eps: 11.26, g: 9, peAlvo: 30.6, pot: "MUITO POTENCIAL", nota: "Gestão de energia e redes elétricas." },
      { t: "EME", apiSym: "EME", n: "Emcor Group", s: "Indústria", tipo: "DIVIDENDOS", m: "$", p: 410.00, eps: 15.77, g: 9, peAlvo: 27.0, pot: "MUITO POTENCIAL", nota: "Engenharia elétrica e mecânica." },
      { t: "MOD", apiSym: "MOD", n: "Modine Manufacturing", s: "Indústria", tipo: "ACUMULATIVO", m: "$", p: 135.00, eps: 6.14, g: 11, peAlvo: 25.7, pot: "MUITO POTENCIAL", nota: "Soluções térmicas industriais e data centers." },
      { t: "FCX", apiSym: "FCX", n: "Freeport-McMoRan", s: "Indústria", tipo: "DIVIDENDOS", m: "$", p: 46.20, eps: 2.20, g: 7, peAlvo: 24.5, pot: "MUITO POTENCIAL", nota: "Extração de cobre e minerais." },
      { t: "BA", apiSym: "BA", n: "Boeing Co.", s: "Indústria", tipo: "DIVIDENDOS", m: "$", p: 155.00, eps: -5.20, g: 0, peAlvo: 15.0, pot: "POUCO", nota: "Aviação comercial e defesa." },
      { t: "MSTR", apiSym: "MSTR", n: "MicroStrategy", s: "Cripto", tipo: "ACUMULATIVO", m: "$", p: 245.00, eps: 3.77, g: 8, peAlvo: 51.7, pot: "MUITO POTENCIAL", nota: "Software empresarial e tesouraria em Bitcoin." }
    ];

    function calcularValorIntrinseco(a) {
      if (a.eps <= 0) {
        return Number((a.p * 0.65).toFixed(2));
      }
      // Projeção a 5 anos descontada a 10%
      const eps5Anos = a.eps * Math.pow(1 + (a.g / 100), 5);
      const valorFuturo = eps5Anos * a.peAlvo;
      const vi = valorFuturo / Math.pow(1.10, 5);
      return Number(vi.toFixed(2));
    }

    function calcularAvaliacao(p, vi) {
      const margem = ((vi - p) / vi) * 100;
      if (margem >= 20) return "MUITO BARATO";
      if (margem >= 8) return "BARATO";
      if (margem >= -5) return "PREÇO JUSTO";
      if (margem >= -20) return "CARO";
      return "MUITO CARO";
    }

    function calcularSinal(a, av) {
      if (a.eps <= 0 || av === "MUITO CARO") return "NÃO COMPRAR";
      if (av === "MUITO BARATO" || av === "BARATO" || av === "PREÇO JUSTO") return "COMPRAR";
      return "AGUARDAR";
    }

    function calcularPeAtual(a) {
      if (a.eps <= 0) return "Prejuízo";
      return (a.p / a.eps).toFixed(1);
    }

    function guardarApiKey() {
      apiKey = document.getElementById("apiKeyInput").value.trim();
      if (apiKey) {
        localStorage.setItem("radar_finnhub_key", apiKey);
      } else {
        localStorage.removeItem("radar_finnhub_key");
      }
      atualizarTudo(true);
    }

    async function buscarCotacoesReais() {
      if (!apiKey) {
        document.getElementById("fonteEstado").innerText = "Base local ativa (sem API Key Finnhub)";
        return false;
      }

      const simbolosComApi = ativos.filter(a => a.apiSym);
      let atualizados = 0;

      // Pequeno atraso entre pedidos para evitar rate-limit em planos gratuitos
      for (const item of simbolosComApi) {
        try {
          const resp = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(item.apiSym)}&token=${encodeURIComponent(apiKey)}`);
          if (!resp.ok) continue;
          const data = await resp.json();
          if (typeof data.c === "number" && data.c > 0) {
            item.p = Number(data.c.toFixed(2));
            atualizados++;
          }
        } catch (_) {
          // Mantém o último valor conhecido se houver falha de rede
        }
        await new Promise(r => setTimeout(r, 120));
      }

      document.getElementById("fonteEstado").innerText = atualizados > 0
        ? `Finnhub ao vivo (${atualizados} cotações sincronizadas)`
        : "Sem resposta da API — a manter últimos valores";
      return atualizados > 0;
    }

    async function atualizarTudo(manual = false) {
      await buscarCotacoesReais();
      const agora = new Date().toLocaleTimeString('pt-PT');
      document.getElementById("statusLeitura").innerText = `${manual ? "Atualização manual" : "Atualização automática"} às ${agora} • Valor Intrínseco Recalculado`;
      renderizar();
    }

    function filtrarSinal(f, elemento) {
      sinalAtivo = f;
      document.querySelectorAll('.filtros button').forEach(b => b.classList.remove('ativo'));
      if (elemento) elemento.classList.add('ativo');
      renderizar();
    }

    function renderizar() {
      const setorSelecionado = document.getElementById("filtroSetor").value;
      const termo = document.getElementById("pesquisa").value.toLowerCase();
      const grelha = document.getElementById("grelha");
      grelha.innerHTML = "";

      const filtrados = ativos.filter(a => {
        const vi = calcularValorIntrinseco(a);
        const avAtual = calcularAvaliacao(a.p, vi);
        const decAtual = calcularSinal(a, avAtual);

        const matchSetor = setorSelecionado === "TODOS" || a.s === setorSelecionado;
        const matchTermo = a.t.toLowerCase().includes(termo) || a.n.toLowerCase().includes(termo);

        let matchSinal = true;
        if (sinalAtivo === "COMPRAR") matchSinal = decAtual === "COMPRAR";
        else if (sinalAtivo === "MUITO_BARATO") matchSinal = avAtual === "MUITO BARATO";
        else if (sinalAtivo === "BARATO") matchSinal = avAtual === "BARATO";
        else if (sinalAtivo === "ACUMULATIVO") matchSinal = a.tipo === "ACUMULATIVO";
        else if (sinalAtivo === "DIVIDENDOS") matchSinal = a.tipo === "DIVIDENDOS";

        return matchSetor && matchTermo && matchSinal;
      });

      if (filtrados.length === 0) {
        grelha.innerHTML = `<p style="color: #94a3b8; grid-column: 1/-1; text-align: center; padding: 40px;">Nenhum ativo encontrado com estes filtros.</p>`;
        return;
      }

      filtrados.forEach(a => {
        const vi = calcularValorIntrinseco(a);
        const avAtual = calcularAvaliacao(a.p, vi);
        const decAtual = calcularSinal(a, avAtual);
        const peAtual = calcularPeAtual(a);

        const margem = (((vi - a.p) / vi) * 100).toFixed(1);
        const corMargem = margem > 0 ? "#34d399" : "#f87171";
        const sinalMargem = margem > 0 ? `+${margem}%` : `${margem}%`;

        let classeCard = "aguardar";
        if (decAtual === "COMPRAR") classeCard = "comprar";
        if (decAtual === "NÃO COMPRAR") classeCard = "evitar";

        const classeDec = decAtual === "COMPRAR" ? "comprar" : (decAtual === "AGUARDAR" ? "aguardar" : "evitar");
        const classeTipo = a.tipo === "ACUMULATIVO" ? "acumulativo" : "dividendos";

        grelha.innerHTML += `
          <div class="card ${classeCard}">
            <div>
              <div class="card-header">
                <div>
                  <span class="ticker">${a.t}</span>
                  <span class="setor">${a.s}</span>
                  <div class="nome">${a.n}</div>
                </div>
                <span class="badge-decisao ${classeDec}">${decAtual}</span>
              </div>
              <div class="badges-row">
                <span class="badge-tipo ${classeTipo}">${a.tipo}</span>
                <span class="badge-av">${avAtual}</span>
              </div>
              <div class="valuation-grid">
                <div class="val-item">
                  <span>Preço Atual</span>
                  <strong style="color: #ffffff;">${a.m}${a.p.toFixed(2)}</strong>
                </div>
                <div class="val-item">
                  <span>Valor Intrínseco</span>
                  <strong style="color: #38bdf8;">${a.m}${vi.toFixed(2)}</strong>
                </div>
                <div class="val-item">
                  <span>Margem Seg.</span>
                  <strong style="color: ${corMargem};">${sinalMargem}</strong>
                </div>
              </div>
              <div class="nota">${a.nota}</div>
            </div>
            <div class="card-footer">
              <span>P/E: <strong style="color: #e2e8f0;">${peAtual}</strong></span>
              <span>Potencial: <strong style="color: #e2e8f0;">${a.pot}</strong></span>
            </div>
          </div>
        `;
      });
    }

    setInterval(() => {
      segundosRestantes--;
      if (segundosRestantes <= 0) {
        segundosRestantes = 120;
        atualizarTudo(false);
      }
      const min = String(Math.floor(segundosRestantes / 60)).padStart(2, '0');
      const seg = String(segundosRestantes % 60).padStart(2, '0');
      document.getElementById("contador").innerText = `${min}:${seg}`;
    }, 1000);

    renderizar();
    if (apiKey) {
      atualizarTudo(false);
    }
  </script>
</body>
