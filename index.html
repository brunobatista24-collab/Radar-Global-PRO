      { t: "VRT", n: "Vertiv Holdings", s: "Indústria", tipo: "ACUMULATIVO", m: "$", p: 112.50, vi: 118.00, pe: "32.0", dec: "COMPRAR", pot: "MUITO POTENCIAL", nota: "Refrigeração e energia para Data Centers de IA." },
      { t: "ETN", n: "Eaton Corp.", s: "Indústria", tipo: "DIVIDENDOS", m: "$", p: 332.10, vi: 345.00, pe: "29.5", dec: "COMPRAR", pot: "MUITO POTENCIAL", nota: "Equipamento elétrico essencial para redes." },
      { t: "EME", n: "Emcor Group", s: "Indústria", tipo: "DIVIDENDOS", m: "$", p: 410.00, vi: 425.00, pe: "26.0", dec: "COMPRAR", pot: "MUITO POTENCIAL", nota: "Construção elétrica ligada a infraestruturas." },
      { t: "MOD", n: "Modine Manufacturing", s: "Indústria", tipo: "ACUMULATIVO", m: "$", p: 135.00, vi: 158.00, pe: "22.0", dec: "COMPRAR", pot: "MUITO POTENCIAL", nota: "Gestão térmica para data centers." },
      { t: "FCX", n: "Freeport-McMoRan", s: "Indústria", tipo: "DIVIDENDOS", m: "$", p: 46.20, vi: 54.00, pe: "21.0", dec: "COMPRAR", pot: "MUITO POTENCIAL", nota: "Produtor líder de cobre para eletrificação." },
      { t: "BA", n: "Boeing Co.", s: "Indústria", tipo: "DIVIDENDOS", m: "$", p: 155.00, vi: 125.00, pe: "Prejuízo", dec: "NÃO COMPRAR", pot: "POUCO", nota: "Problemas crónicos de produção e dívida." },
      { t: "MSTR", n: "MicroStrategy", s: "Cripto", tipo: "ACUMULATIVO", m: "$", p: 245.00, vi: 195.00, pe: "65.0", dec: "AGUARDAR", pot: "MUITO POTENCIAL", nota: "Ação altamente alavancada à Bitcoin." }
    ];

    function calcularAvaliacao(p, vi) {
      const margem = ((vi - p) / vi) * 100;
      if (margem >= 20) return "MUITO BARATO";
      if (margem >= 8) return "BARATO";
      if (margem >= -5) return "PREÇO JUSTO";
      if (margem >= -20) return "CARO";
      return "MUITO CARO";
    }

    function simularOscilacaoMercado() {
      ativos.forEach(a => {
        // Variação realista entre -1.2% e +1.2% a cada ciclo de atualização
        const variacao = 1 + ((Math.random() - 0.5) * 0.024);
        a.p = Number((a.p * variacao).toFixed(2));
      });
      const agora = new Date().toLocaleTimeString('pt-PT');
      document.getElementById("statusLeitura").innerText = `Última atualização de mercado às ${agora} • Valor Intrínseco Ativo`;
    }

    function forcarAtualizacao() {
      segundosRestantes = 120;
      document.getElementById("contador").innerText = "02:00";
      simularOscilacaoMercado();
      renderizar();
    }

    function filtrarSinal(f, elemento) {
      sinalAtivo = f;
      document.querySelectorAll('.filtros button').forEach(b => b.classList.remove('ativo'));
      if (elemento) elemento.classList.add('ativo');
      renderizar();
    }

    function renderizar() {
      const setorSelecionado = document.getElementById("filtroSetor").value;
      const termo = document.getElementById("pesquisa").value.toLowerCase();
      const grelha = document.getElementById("grelha");
      grelha.innerHTML = "";

      const filtrados = ativos.filter(a => {
        const avAtual = calcularAvaliacao(a.p, a.vi);
        const matchSetor = setorSelecionado === "TODOS" || a.s === setorSelecionado;
        const matchTermo = a.t.toLowerCase().includes(termo) || a.n.toLowerCase().includes(termo);
        
        let matchSinal = true;
        if (sinalAtivo === "COMPRAR") matchSinal = a.dec === "COMPRAR";
        else if (sinalAtivo === "MUITO_BARATO") matchSinal = avAtual === "MUITO BARATO";
        else if (sinalAtivo === "BARATO") matchSinal = avAtual === "BARATO";
        else if (sinalAtivo === "ACUMULATIVO") matchSinal = a.tipo === "ACUMULATIVO";
        else if (sinalAtivo === "DIVIDENDOS") matchSinal = a.tipo === "DIVIDENDOS";

        return matchSetor && matchTermo && matchSinal;
      });

      if (filtrados.length === 0) {
        grelha.innerHTML = `<p style="color: #94a3b8; grid-column: 1/-1; text-align: center; padding: 40px;">Nenhum ativo encontrado com estes filtros.</p>`;
        return;
      }

      filtrados.forEach(a => {
        const avAtual = calcularAvaliacao(a.p, a.vi);
        const margem = (((a.vi - a.p) / a.vi) * 100).toFixed(1);
        const corMargem = margem > 0 ? "#34d399" : "#f87171";
        const sinalMargem = margem > 0 ? `+${margem}%` : `${margem}%`;

        let classeCard = "aguardar";
        if (a.dec === "COMPRAR") classeCard = "comprar";
        if (a.dec === "NÃO COMPRAR") classeCard = "evitar";

        const classeDec = a.dec === "COMPRAR" ? "comprar" : (a.dec === "AGUARDAR" ? "aguardar" : "evitar");
        const classeTipo = a.tipo === "ACUMULATIVO" ? "acumulativo" : "dividendos";

        grelha.innerHTML += `
          <div class="card ${classeCard}">
            <div>
              <div class="card-header">
                <div>
                  <span class="ticker">${a.t}</span>
                  <span class="setor">${a.s}</span>
                  <div class="nome">${a.n}</div>
                </div>
                <span class="badge-decisao ${classeDec}">${a.dec}</span>
              </div>
              <div class="badges-row">
                <span class="badge-tipo ${classeTipo}">${a.tipo}</span>
                <span class="badge-av">${avAtual}</span>
              </div>
              <div class="valuation-grid">
                <div class="val-item">
                  <span>Preço Atual</span>
                  <strong style="color: #ffffff;">${a.m}${a.p.toFixed(2)}</strong>
                </div>
                <div class="val-item">
                  <span>Valor Intrínseco</span>
                  <strong style="color: #38bdf8;">${a.m}${a.vi.toFixed(2)}</strong>
                </div>
                <div class="val-item">
                  <span>Margem Seg.</span>
                  <strong style="color: ${corMargem};">${sinalMargem}</strong>
                </div>
              </div>
              <div class="nota">${a.nota}</div>
            </div>
            <div class="card-footer">
              <span>P/E: <strong style="color: #e2e8f0;">${a.pe}</strong></span>
              <span>Potencial: <strong style="color: #e2e8f0;">${a.pot}</strong></span>
            </div>
          </div>
        `;
      });
    }

    setInterval(() => {
      segundosRestantes--;
      if (segundosRestantes <= 0) {
        segundosRestantes = 120;
        simularOscilacaoMercado();
        renderizar();
      }
      const min = String(Math.floor(segundosRestantes / 60)).padStart(2, '0');
      const seg = String(segundosRestantes % 60).padStart(2, '0');
      document.getElementById("contador").innerText = `${min}:${seg}`;
    }, 1000);

    renderizar();
  </script>
</body>
</html>
